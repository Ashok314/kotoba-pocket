name: Package Chrome extension
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm run zip:extension
      - uses: actions/upload-artifact@v4
        with:
          name: kotoba-pocket-extension
          path: release/*.zip
